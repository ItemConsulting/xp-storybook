name: CI
on:
  # Only main and next (the prerelease branch), because every other branch is covered by
  # pull_request below. Keeping "**" here as well would run each pushed branch twice once it has a PR.
  push:
    branches:
      - main
      - next

  # A fork's commits live in the fork, so a push event never fires for them and a contributor's
  # pull request would otherwise get no CI at all.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main or next: it ends by publishing (see the publish job).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/next' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # The com.enonic.xp.settings plugin needs a Gradle JVM of 21+, and XP 8 compiles against Java 25
      # The version is read from .java-version, which can differ between main and next
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version

      - uses: gradle/actions/setup-gradle@v6

      # Fails on a package-lock.json that has drifted from package.json, which
      # the `npm install` Gradle runs through npmInstall would silently repair.
      - run: npm ci

      # Runs check (biome + tsc, via npmCheck), the node:test suite (via npmTest), the JUnit tests,
      # compiles the Java sources, runs tsdown (via npmBuild) and builds the jar. The previous workflow ran only
      # `npm run lint && npm run build`, so neither the Java compiler nor the type checker ever
      # saw a commit.
      - run: ./gradlew build

      # The HTML report is the only place holding the standard output of a failing JUnit test, and
      # the file:// link Gradle prints is dead on a runner. Keep it for the runs where it matters.
      # node:test failures print straight into the log above and need no artifact.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7

  # Publish is called from here, rather than started by a workflow_run, so that it runs for the
  # branch and commit that was pushed: changesets/action takes both from GITHUB_REF and GITHUB_SHA,
  # which a workflow_run always sets to main, so a push to next would version and release main.
  publish:
    needs: build
    # Only a push publishes, and on.push only lists main and next (the prerelease branch, in
    # changesets pre mode). A pull request, a fork's included, never reaches this job.
    if: github.event_name == 'push'
    permissions:
      contents: write # push the version bump commit and the v<version> tag, create the release
      pull-requests: write # open and update the "Version Packages" PR
    uses: ./.github/workflows/publish.yml
    secrets: inherit
