plugins {
  id "maven-publish"
  id "com.github.node-gradle.node" version "7.1.0"
  id "com.enonic.xp.app"
}

dependencies {
  implementation xplibs.api.core
  implementation xplibs.api.portal
  include libs.freemarker.java8
  include libs.xp.freemarker
  include libs.xp.time
  include libs.thymeleaf
  compileOnly libs.thymeleaf.engine

  testImplementation platform(libs.junit.bom)
  testImplementation libs.junit.jupiter
  // Gradle 9 no longer puts the launcher on the test runtime classpath by itself.
  testRuntimeOnly libs.junit.platform.launcher
}

repositories {
  mavenCentral()
  xp.enonicRepo()
  maven { url "https://repo.itemtest.no/releases" }
  maven { url "https://repo.itemtest.no/snapshots" }
}

node {
  download = true
  // Single source of truth for the Node version, shared with .github/workflows and nvm
  version = file(".nvmrc").text.trim()
}

processResources {
	exclude "**/.gitkeep"
  exclude "**/*.json"
	exclude "**/*.ts"
	exclude "**/*.tsx"
}

tasks.register("npmBuild", NpmTask) {
  args = [
    "run",
    "--silent",
    "build"
  ]
  dependsOn npmInstall
  environment = [
    "FORCE_COLOR": "true",
    "LOG_LEVEL_FROM_GRADLE": gradle.startParameter.logLevel.toString(),
    "NODE_ENV": project.findProperty("env") == "dev" ? "development" : "production"
  ]
  inputs.dir "src/main/resources"
  outputs.dir "build/resources/main"
  outputs.upToDateWhen { false }
}

jar.dependsOn npmBuild

// npmBuild writes into build/resources/main, which is on the test compile classpath
compileTestJava.dependsOn npmBuild

tasks.register("npmCheck", NpmTask) {
	dependsOn npmInstall
	args = [
		"run",
		"check"
	]
	environment = [
		"FORCE_COLOR": "true",
	]
}

check.dependsOn npmCheck

tasks.register("npmTest", NpmTask) {
	dependsOn npmInstall
	args = [
		"run",
		"test"
	]
	environment = [
		"FORCE_COLOR": "true",
	]
  inputs.dir "src/test"
  inputs.dir "src/main/resources"
  outputs.upToDateWhen { false }
}

test.dependsOn npmTest

tasks.test {
  useJUnitPlatform()

  // Gradle otherwise reports a failure as a bare "AssertionFailedError at Foo.java:9" and points at
  // an HTML report, which is a dead file:// link on a CI runner. Print the assertion message and
  // stack trace instead, so a failed workflow run explains itself in the log.
  testLogging {
    events "failed"
    exceptionFormat = "full"
    showStackTraces = true
    showCauses = true
  }
}

tasks.withType(Copy).configureEach {
  includeEmptyDirs = false
}

publishing {
  repositories {
    maven {
      name = "itemtestRepository"
      url = version.endsWith('SNAPSHOT')
        ? "https://repo.itemtest.no/snapshots"
        : "https://repo.itemtest.no/releases"
      credentials(PasswordCredentials)
      authentication {
        basic(BasicAuthentication)
      }
    }
  }
  publications {
    maven(MavenPublication) {
      from components.java
      groupId group
      artifactId projectName
      version version
    }
  }
}
