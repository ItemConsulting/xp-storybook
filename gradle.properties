# Gradle Project settings
projectName = xp-storybook
version = 1.5.0

# XP App values
appName = no.item.storybook
# Deliberately the XP 8.0 floor, not the newest 8.0.x. The app jar declares
# X-System-Version: [8.0,9), so it installs on any XP 8 — compiling against 8.0.0 is what keeps
# that promise honest. Raise it only if the app starts needing a later 8.0.x API, and raise the
# pinned @enonic-types/* versions in package.json to match.
xpVersion = 8.0.0

# Settings for publishing to a Maven repo
group = no.item
